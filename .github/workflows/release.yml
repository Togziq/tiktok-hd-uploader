name: Release

# Push a tag like v1.0.0 to build the .exe and publish a GitHub Release.
# Running it manually (Actions -> Release -> Run workflow) only builds and uploads an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path app.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "app.py has __version__ = $version, but the tag is ${{ github.ref_name }}"
          }

      - name: Build exe
        run: pyinstaller --noconfirm --clean tiktok-hd-uploader.spec

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/TikTok-HD-Uploader.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TikTok-HD-Uploader.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TikTok-HD-Uploader
          path: |
            dist/TikTok-HD-Uploader.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TikTok-HD-Uploader.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
